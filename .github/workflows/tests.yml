name: Tests

# ECL-124 · Pruebas automatizadas: unitarias e integración del backend, unitarias
# del frontend y la suite E2E de Playwright en Chromium, Firefox y WebKit, en modo
# headless. Cada job sube sus reportes como artefactos.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests / Backend unit and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_ci_test
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ecologistica_ci
          POSTGRES_PASSWORD: ecologistica_ci
          POSTGRES_DB: ecologistica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ecologistica_ci --dbname=ecologistica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Create isolated test database
        run: >-
          docker exec "${{ job.services.postgis.id }}"
          createdb --username=ecologistica_ci --owner=ecologistica_ci
          --template=template_postgis ecologistica_ci_test

      - name: Run unit tests
        run: python -m pytest tests/unit -q --junitxml=test-results/unit.xml

      - name: Run integration tests
        run: python -m pytest tests/integration -q --junitxml=test-results/integration.xml

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-backend-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Tests / Frontend unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: >-
          npm test -- --reporter=default --reporter=junit
          --outputFile.junit=test-results/frontend-unit.xml

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-frontend-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: Tests / E2E Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_demo
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:8000
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ecologistica_ci
          POSTGRES_PASSWORD: ecologistica_ci
          POSTGRES_DB: ecologistica_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ecologistica_ci --dbname=ecologistica_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Generate one-off demo passwords
        # Random per run and masked in the logs; never stored in the repository.
        run: |
          for rol in ADMINISTRADOR OPERADOR CONDUCTOR ANALISTA AUDITOR; do
            value="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)"
            echo "::add-mask::$value"
            echo "SEED_DEMO_PASSWORD_$rol=$value" >> "$GITHUB_ENV"
          done

      - name: Install backend and seed today's demo (150 orders, 15 vehicles)
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m alembic upgrade head
          python -m scripts.seed_demo_mvp --fecha "$(TZ=America/Lima date +%F)"

      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat ../api.log; exit 1

      - name: Build and serve the frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && exit 0; sleep 1; done
          cat ../preview.log; exit 1

      - name: Install ${{ matrix.browser }}
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E suite on ${{ matrix.browser }}
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            api.log
          if-no-files-found: warn
          retention-days: 30
